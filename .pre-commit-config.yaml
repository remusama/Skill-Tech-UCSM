# Pre-commit configuration for Skill-Tech-V0 security and quality
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: block-dotenv
        name: Block dotenv files
        entry: python scripts/pre_commit_block_env.py
        language: python
        files: ^\.env.*$
