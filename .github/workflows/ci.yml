name: CI — Lint, Test, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-check:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server_py/requirements.txt
          pip install pytest flake8 pip-audit httpx

      - name: Security audit (pip-audit)
        run: pip-audit -r server_py/requirements.txt --ignore-vuln GHSA-34jh-p97f-mpxf
        continue-on-error: true  # Warn but don't block on advisory-only issues

      - name: Lint with flake8
        run: |
          flake8 server_py \
            --max-line-length=120 \
            --exclude=server_py/migrations,server_py/__pycache__,server_py/tests \
            --ignore=E501,W503

      - name: Run unit tests
        env:
          DATABASE_URL: ""
          OPENAI_API_KEY: "sk-test-placeholder"
          GEMINI_API_KEY: "gemini-test-placeholder"
          ELEVENLABS_API_KEY: "el-test-placeholder"
          ENABLE_DB_SESSION: "false"
        run: |
          cd ${{ github.workspace }}
          pytest server_py/tests/test_pr_a.py server_py/tests/test_adapter.py -v --tb=short

  frontend-check:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build

  gitleaks-scan:
    name: Security — Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
